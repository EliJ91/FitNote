<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#030604">
    <title>FitNote</title>
    <link rel="icon" href="icons/fitnote-app-logo.png" type="image/png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css?v=74">
  </head>
  <body>
    <div id="app" class="app-shell"></div>

    <input id="import-file" class="visually-hidden" type="file" accept="application/json,.json">

    <div id="confirm-backdrop" class="confirm-backdrop" hidden>
      <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">Confirm</h2>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="btn btn-secondary" type="button">Cancel</button>
          <button id="confirm-ok" class="btn btn-primary" type="button">OK</button>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="fitnote-config.js?v=74" defer></script>
    <script src="fitnote-history.js?v=74" defer></script>
    <script src="app.js?v=74" defer></script>
  </body>
</html>
